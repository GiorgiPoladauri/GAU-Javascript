<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>SFP Regiter/Login</title>
</head>
<body>
    <div class="div1">
        <div class="subdiv1">
            <div class="subsubdiv1">
                <form action="" method="post" class="form1">
                    <h2>Register</h2>
                    <input type="text" placeholder="Email" id="i1">
                    <br>
                    <input type="text" placeholder="Nickname" id="i2">
                    <br>
                    <input type="password" placeholder="Password" id="i3">
                    <br>
                    <input type="password" placeholder="Confirm Password" id="i4">
                    <br>
                    <input type="text" placeholder="Country" id="i5">
                    <br>
                    <input type="text" placeholder="City" id="i6">
                    <br>
                    <input type="text" placeholder="Phone e.g (+995...)" id="i7">
                    <br>
                    <button>Register</button>    
                </form>
            </div>
            <div class="subsubdiv2">
                <form action="" method="post" class="form2">
                    <h2>Login</h2>
                    <input type="text" placeholder="Email" id="i8">
                    <br>
                    <input type="password" placeholder="Password" id="i9">
                    <br>
                    <button>Login</button>
                </form>
            </div>
        </div>
        <div class="subdiv2">
            <a href="index.html"><img src="FilesFolder/icon2.svg" alt=""></a>
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
